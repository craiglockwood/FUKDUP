name: Build FUKDUP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Make Mac installer
        if: runner.os == 'macOS'
        run: |
          set -e
          VERSION=$(sed -n 's/^project(FUKDUP VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          VERSION=${VERSION:-1.0.0}
          ART=build/FUKDUP_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Library/Audio/Plug-Ins/VST3"
          cp -R "$ART/AU/FUKDUP.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$ART/VST3/FUKDUP.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"

          mkdir -p scripts resources
          printf '#!/bin/bash\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > scripts/postinstall
          chmod +x scripts/postinstall
          printf '<html><body style="font-family:-apple-system"><h2>FUKDUP %s</h2><p>An audio destruction unit made by Craig Lockwood.</p><p>This installs the FUKDUP Audio Unit and VST3 plugins. Restart your DAW afterwards.</p></body></html>' "$VERSION" > resources/welcome.html

          pkgbuild --analyze --root "$ROOT" components.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" components.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist
            i=$((i+1))
          done

          pkgbuild --root "$ROOT" --component-plist components.plist --scripts scripts \
            --identifier com.fukdup.fukdup.pkg --version "$VERSION" --install-location / FUKDUP-core.pkg
          productbuild --synthesize --package FUKDUP-core.pkg distribution.xml
          sed -i '' "s#<installer-gui-script minSpecVersion=\"[0-9]*\">#&<title>FUKDUP $VERSION</title><welcome file=\"welcome.html\" mime-type=\"text/html\"/>#" distribution.xml
          productbuild --distribution distribution.xml --resources resources --package-path . "FUKDUP-$VERSION-Installer.pkg"

      - name: Upload Mac installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FUKDUP-Mac-Installer
          path: FUKDUP-*-Installer.pkg

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: FUKDUP-${{ matrix.os }}
          path: |
            build/FUKDUP_artefacts/Release/VST3
            build/FUKDUP_artefacts/Release/AU
          if-no-files-found: ignore
